name: Deploy Workshop Site

on:
  push:
    branches: [main]
    paths:
      - 'build-day-quarkus/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to jolynt24/build-day-quarkus
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          repository-name: jolynt24/build-day-quarkus
          branch: gh-pages
          folder: build-day-quarkus
          clean: true
