name: Deploy Workshop Site

on:
  push:
    branches: [main]
    paths:
      - '2026/build-day/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to jolynt24/build-day
        run: |
          cd 2026/build-day
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy workshop site"
          git push --force \
            https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/jolynt24/build-day.git \
            HEAD:gh-pages
