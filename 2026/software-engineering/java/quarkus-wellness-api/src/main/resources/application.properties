# Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=wellness_user
quarkus.datasource.password=wellness_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/wellness_db

# Logging
quarkus.log.level=INFO

# JWT
mp.jwt.verify.issuer=fractalschema
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem

# Dev only - shows more auth errors
quarkus.log.category."io.quarkus.smallrye.jwt".level=DEBUG

# Test profile
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.schema-management.strategy=none

quarkus.swagger-ui.always-include=true

# FlyAway Config
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db
quarkus.flyway.baseline-on-migrate=true